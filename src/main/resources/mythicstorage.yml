mythicstorage_version: 2

# Worlds that will not be affected by MythicStorage feature
blacklist_world:
  - defaultworld
  - exampleworld

settings:
  enabled: true
  default_max_storage: 5000
  #How to resolve max storage between database/commands and permissions.
  # PERMISSION: Always use permission-based value.
  # DATABASE: Always use database value (set by commands or external systems).
  # MAX: Use the higher value between permission and database.
  # MIN: Use the lower value between permission and database.
  # Default: PERMISSION
  max_storage_mode: PERMISSION
  default_auto_pickup: false

ground_store:
  # Enable/disable ground-store system for MythicStorage.
  enabled: true

  # Default toggle state for new players.
  default_enabled: false

  # MythicMobs item IDs that will be stored when picked up from the ground.
  # IMPORTANT:
  # - This list depends on items_drop.
  # - If an item is not present in items_drop, it will NOT be stored.
  # These must match the IDs used in MythicMobs configs (same IDs as items_drop).
  # Examples:
  # - test
  allowed_items:
    - test

  # Notification settings for ground-store.
  # These notifications reuse the existing MythicStorage notification formats.
  notification:
    actionbar:
      enable: true
    title:
      enable: true

  sound:
    enabled: true
    name: ENTITY_ITEM_PICKUP
    volume: 0.7
    pitch: 1.0

# Storage limit based on permissions (MythicStorage)
# Players with permission storage.mythicstorage.storage.<tier_name> will receive the configured max_storage
# Priority system: higher number = higher priority (overrides lower priority)
# If the player has multiple MythicStorage limit permissions, the highest priority will be used
# If no MythicStorage limit permission is found, settings.default_max_storage will be used
mythic_storage_permissions:
  vip:
    max_storage: 200
    priority: 1
  premium:
    max_storage: 500
    priority: 2
  ultimate:
    max_storage: 1000
    priority: 3
  # You can add more permissions here.
  # abc:
  #  max_storage: 5000
  #  priority: 4

storage_full_notification:
  enabled: true
  cooldown_seconds: 10

notification:
  title:
    enable: false
    item_added:
      title: "&a+ #amount# #item#"
      subtitle: "&a#storage#&7/&a#max#"
    storage_full:
      title: "&cStorage Full!"
      subtitle: "&7(&c#storage#&7/&c#max#&7)"
  actionbar:
    enable: true
    # Placeholders: #item#, #amount#, #storage#, #max#
    item_added: "&a+ #amount# #item# &7| &a#storage#&7/&a#max#"
    storage_full: "&cStorage Full! &7(&c#storage#&7/&c#max#&7)"

# Items that can be added to the storage (MythicMobs/Items/<item>.yml)
# example:
# In MM 5.X.X
#test: <--- ID item mythicmobs will be used on configuration items_drop
#  Id: diamond
#  Display: '&dabc'
#  Lore:
#    - '&6A kingly crowl that grants'
#    - '&6the wearer unwavering power!'
#  Enchantments:
#    - PROTECTION_ENVIRONMENTAL:2
#    - PROTECTION_PROJECTILE:2
#    - PROTECTION_FIRE:2
#    - PROTECTION_EXPLOSIONS:2
#  Hide:
#    - ATTRIBUTES
#    - ENCHANTS
#  Attributes:
#    Head:
#      Health: 10
#      KnockbackResistance: 10
items_drop:
  - test

# MythicStorage Transfer settings
transfer:
  enabled: true
  delay: 3
  max_history_display: 10
  particles:
    enabled: true
    processing:
      animation: "circle"
      type: "ENCHANTMENT_TABLE"
      count: 8
      speed: 0.1
      radius: 1.5
      duration: 3
    beam:
      animation: "line"
      type: "FIREWORKS_SPARK"
      count: 3
      speed: 0.2
      duration: 3
    success:
      animation: "burst"
      type: "VILLAGER_HAPPY"
      count: 15
      speed: 0.1
      radius: 2.0
    receive:
      animation: "circle"
      type: "HEART"
      count: 8
      speed: 0.1
      radius: 1.2
    failed:
      animation: "burst"
      type: "SMOKE_NORMAL"
      count: 12
      speed: 0.15
      radius: 1.8
  sounds:
    enabled: true
    success:
      name: "ORB_PICKUP"
      volume: 1.0
      pitch: 1.2
    receive:
      name: "ITEM_PICKUP"
      volume: 0.8
      pitch: 1.0
    failed:
      name: "VILLAGER_NO"
      volume: 0.8
      pitch: 0.8
