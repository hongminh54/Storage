mythicstorage_version: 1

# Worlds that will not be affected by MythicStorage feature
blacklist_world:
  - defaultworld
  - exampleworld

settings:
  enabled: true
  default_max_storage: 5000
  default_auto_pickup: false

storage_full_notification:
  enabled: true
  cooldown_seconds: 10

notification:
  title:
    enable: false
    item_added:
      title: "&a+ #amount# #item#"
      subtitle: "&7Storage: &a#storage#&7/&a#max#"
    # Storage full notifications
    storage_full:
      title: "&cStorage Full!"
      subtitle: "&7(&c#storage#&7/&c#max#&7)"
  actionbar:
    enable: true
    # Placeholders: #item#, #amount#, #storage#, #max#
    item_added: "&a+ #amount# #item# &7| &a#storage#&7/&a#max#"
    storage_full: "&cStorage Full! &7(&c#storage#&7/&c#max#&7)"

