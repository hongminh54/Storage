name: Storage
version: '${project.version}'
main: net.danh.storage.Storage
author: VoChiDanh, hongminh54
description: "${project.description}"
api-version: '1.13'
folia-supported: true
load: STARTUP
softdepend:
  - WorldGuard
  - PlaceholderAPI
  - MythicMobs
  - LuckPerms
  - MMOItems
  - MythicLib
  - PlayerPoints
  - Vault
  - VaultUnlocked

commands:
  storage:
    description: Main command
    aliases:
      - kho
      - kks
      - khokhoangsan

  mythicstorage:
    description: MythicMobs storage command
    aliases:
      - mythics
      - khoquaivat
      - kqv
      - khoqv

  cropstorage:
    description: Crop storage command
    aliases:
      - cstorage
      - khonongsan
      - khons
      - cropss

  mobstorage:
    description: Mob drops storage command
    aliases:
      - khomob
      - khosinhvat
      - ksv
      - mstore
      
permissions:
  storage.user:
    description: User permission
    default: true
    children:
      storage.toggle: true
      storage.groundstore: true
      storage.deposit: true
      storage.withdraw: true
      storage.sell: true
      storage.view: true
      storage.transfer.use: true
      storage.transfer.multi: true
      storage.transfer.log: true
      storage.transfer.log.others: true
      storage.enchant.use: true
      storage.event.view: true
      storage.craft.use: true
      storage.mythicstorage.use: true
      storage.mythicstorage.toggle: true
      storage.mythicstorage.groundstore: true
      storage.mythicstorage.view: true
      storage.mythicstorage.transfer: true
      storage.mythicstorage.transfer.multi: true
      storage.mythicstorage.transfer.log: true
      storage.mythicstorage.transfer.log.others: true
      storage.cropstorage.use: true
      storage.cropstorage.toggle: true
      storage.cropstorage.groundstore: true
      storage.cropstorage.view: true
      storage.cropstorage.transfer.use: true
      storage.cropstorage.transfer.multi: true
      storage.cropstorage.transfer.log: true
      storage.mobstorage.use: true
      storage.mobstorage.toggle: true
      storage.mobstorage.groundstore: true
      storage.mobstorage.view: true
      storage.mobstorage.deposit: true
      storage.mobstorage.withdraw: true
      storage.mobstorage.sell: true
      storage.mobstorage.autosell: true
      storage.friends.use: true
      storage.friends.add: true
      storage.friends.accept: true
      storage.friends.deny: true
      storage.friends.remove: true
      storage.friends.list: true
      storage.friends.deposit: true
      storage.friends.withdraw: true
      storage.friends.history: true
      storage.friends.settings: true
      storage.friends.open: true

  storage.toggle:
    description: Toggle permission
    default: true

  storage.groundstore:
    description: Toggle Storage ground-store
    default: true

  storage.deposit:
    description: Deposit items into storage
    default: true

  storage.withdraw:
    description: Withdraw items from storage
    default: true

  storage.sell:
    description: Sell items from storage
    default: true

  storage.autosell:
    description: Toggle per-item auto sell for Storage
    default: op

  storage.admin:
    description: Admin permission
    default: op
    children:
      storage.admin.add: true
      storage.admin.remove: true
      storage.admin.set: true
      storage.admin.max: true
      storage.admin.resetlimit: true
      storage.admin.reload: true
      storage.admin.specialmaterial: true
      storage.admin.reset: true
      storage.admin.enchant: true
      storage.event.admin: true
      storage.transfer.admin: true
      storage.transfer.log.others: true
      storage.convert: true
      storage.craft.admin: true
      storage.mythicstorage.admin: true
      storage.cropstorage.admin: true
      storage.mobstorage.admin: true
      storage.cropstorage.transfer.log.others: true
      storage.preventrebreak.bypass: true

  storage.admin.add:
    description: Admin add permission command
    default: op

  storage.admin.remove:
    description: Admin remove permission command
    default: op

  storage.admin.set:
    description: Admin set permission command
    default: op

  storage.admin.max:
    description: Admin max permission command
    default: op

  storage.admin.resetlimit:
    description: Admin reset storage max limit override
    default: op

  storage.admin.reload:
    description: Admin reload permission command
    default: op

  storage.admin.specialmaterial:
    description: Admin special material permission command
    default: op

  storage.admin.reset:
    description: Admin reset permission command
    default: op

  storage.admin.enchant:
    description: Admin enchant permission command
    default: op

  storage.transfer.use:
    description: Use transfer feature
    default: true

  storage.enchant.use:
    description: Use enchant items
    default: true

  storage.event.admin:
    description: Admin event management permission
    default: op

  storage.event.view:
    description: View event status permission
    default: true

  storage.transfer.multi:
    description: Use multi transfer feature
    default: true

  storage.transfer.log:
    description: View own transfer logs
    default: true

  storage.transfer.log.others:
    description: View other players transfer logs
    default: true

  storage.transfer.admin:
    description: Bypass transfer cooldown and limitations
    default: op

  storage.convert:
    description: Use convert materials feature
    default: op

  storage.view:
    description: View other players' storage
    default: true

  storage.mythicstorage.use:
    description: Use MythicMobs storage feature
    default: true

  storage.mythicstorage.toggle:
