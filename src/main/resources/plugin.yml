name: Storage
version: '${project.version}'
main: net.danh.storage.Storage
author: VoChiDanh, hongminh54
description: "${project.description}"
api-version: '1.13'
folia-supported: true
load: STARTUP
softdepend:
  - WorldGuard
  - PlaceholderAPI
  - MythicMobs
  - LuckPerms
commands:
  storage:
    description: Main command
    aliases:
      - kho
      - kks
  mythicstorage:
    description: MythicMobs storage command
    aliases:
      - mstorage
      - mythics
      - khoquaivat
      - kqv
      - khoqv
permissions:
  storage.toggle:
    description: Toggle permission
  storage.admin:
    description: Admin permission
  storage.admin.add:
    description: Admin add permission command
  storage.admin.remove:
    description: Admin remove permission command
  storage.admin.set:
    description: Admin set permission command
  storage.admin.max:
    description: Admin max permission command
  storage.admin.reload:
    description: Admin reload permission command
  storage.admin.specialmaterial:
    description: Admin special material permission command
  storage.admin.reset:
    description: Admin reset permission command
  storage.admin.enchant:
    description: Admin enchant permission command
  storage.transfer.use:
    description: Use transfer feature
    default: true
  storage.enchant.use:
    description: Use enchant items
    default: true
  storage.event.admin:
    description: Admin event management permission
  storage.event.view:
    description: View event status permission
    default: true
  storage.transfer.multi:
    description: Use multi transfer feature
    default: true
  storage.transfer.log:
    description: View own transfer logs
    default: true
  storage.transfer.log.others:
    description: View other players transfer logs
    default: true
  storage.transfer.admin:
    description: Bypass transfer cooldown and limitations
    default: op
  storage.convert:
    description: Use convert materials feature
    default: op
  storage.view:
    description: View other players' storage
    default: true
  storage.mythicstorage.use:
    description: Use MythicMobs storage feature
    default: true
  storage.mythicstorage.toggle:
    description: Toggle MythicMobs auto-pickup
    default: true
  storage.mythicstorage.view:
    description: View other players' MythicMobs storage
    default: true
  storage.mythicstorage.admin:
    description: Admin commands for MythicMobs storage
    default: op
  storage.mythicstorage.transfer:
    description: Transfer MythicMobs items to other players
    default: true
  storage.mythicstorage.transfer.multi:
    description: Transfer multiple MythicMobs items at once
    default: true
  storage.mythicstorage.transfer.log:
    description: View own MythicMobs transfer logs
    default: true
  storage.mythicstorage.transfer.log.others:
    description: View other players MythicMobs transfer logs
    default: true
  storage.craft.use:
    description: Use crafting feature
    default: true
  storage.craft.admin:
    description: Admin commands for crafting system
    default: op
