# Item Flags Editor GUI Configuration
title: "&0Item Flags | &e#recipe_name#"
size: 3

# Sound when opening this GUI
gui_open_sound:
  enabled: true
  name: "BLOCK_CHEST_OPEN"
  volume: 0.7
  pitch: 1.2

items:
