# Material Editor GUI Configuration
# Used for editing material requirements in recipes
title: "&0Material Editor | &e#recipe_name#"
size: 6

# Sound when opening this GUI
gui_open_sound:
  enabled: true
  name: "BLOCK_CHEST_OPEN"
  volume: 0.7
  pitch: 1.1

items:
  # Decorative items
  decorates:
    slot: 0, 1, 2, 3, 5, 6, 7, 8, 9, 17, 18, 26, 27, 35, 36, 44, 45, 46, 47, 51, 52, 53
    name: "&7"
    material: BLACK_STAINED_GLASS_PANE
    lore:
      - "&7 "
    amount: 1
    damage: 0
    custom-model-data: 0
    unbreakable: true
    enchants:
      DURABILITY: 1
    flags:
      ALL: true

  # Title/Info item
  title:
    slot: 4
    name: "&6&lMaterial Requirements"
    material: CHEST
    lore:
      - "&7Materials needed to craft this recipe"
      - "&7"
      - "&7Materials: &e#material_count# &7/ &e#max_materials#"
      - "&7"
      - "&aClick materials below to edit"
    amount: 1
    damage: 0
    custom-model-data: 0
    unbreakable: true
    enchants:
      DURABILITY: 1
    flags:
      ALL: true

  # Add material button
  add_material:
    slot: 40
    name: "&a&lAdd Material"
    material: LIME_DYE
    lore:
      - "&7Click to add a new"
      - "&7material requirement"
      - "&7"
      - "&eOpens material selection GUI"
    amount: 1
    damage: 0
    custom-model-data: 0
    unbreakable: false
    enchants: {}
    flags: {}
    sound:
      enabled: true
      name: "ENTITY_EXPERIENCE_ORB_PICKUP"
      volume: 0.8
      pitch: 1.5

  # Material full (max reached)
  material_full:
    slot: 40
    name: "&c&lMaterial Limit Reached"
    material: RED_DYE
    lore:
      - "&7You have reached the maximum"
      - "&7of &e10 &7materials per recipe"
      - "&7"
      - "&cRemove some materials first"
    amount: 1
    damage: 0
    custom-model-data: 0
    unbreakable: true
    enchants:
      DURABILITY: 1
    flags:
      ALL: true

  add_mythic_material:
    slot: 50
    name: "&d&lAdd MythicStorage Item"
    material: PURPLE_DYE
    lore:
      - "&7Click to add a MythicMobs"
      - "&7item from MythicStorage"
      - "&7"
      - "&eOpens MythicStorage item selection"
    amount: 1
    damage: 0
    custom-model-data: 0
    unbreakable: false
    enchants: {}
    flags: {}
    sound:
      enabled: true
      name: "ENTITY_EXPERIENCE_ORB_PICKUP"
      volume: 0.8
      pitch: 1.2

  add_mythic_material_disabled:
    slot: 50
    name: "&8&lMythicStorage Unavailable"
    material: GRAY_DYE
    lore:
      - "&7MythicStorage is disabled"
      - "&7or material limit reached"
    amount: 1
    damage: 0
    custom-model-data: 0
    unbreakable: true
    enchants:
      DURABILITY: 1
    flags:
      ALL: true

  # Material slots (dynamic, up to 10 materials)
  material_slot:
    slot: 10, 11, 12, 13, 14, 15, 16, 19, 20, 21
    name: "&e#material#"
    material: "#material#"
    lore:
      - "&7Amount: &a#amount#"
      - "&7"
      - "&eLeft-Click: &a+1"
      - "&eRight-Click: &c-1"
      - "&eShift-Left: &6Custom amount"
      - "&cShift-Right: &4Remove material"
    amount: 1
    damage: 0
    custom-model-data: 0
    unbreakable: false
    enchants: {}
    flags: []
    sound:
      enabled: true
      name: "UI_BUTTON_CLICK"
      volume: 0.5
      pitch: 1.0

  # Back button
  back:
    slot: 49
    name: "&eBack to Editor"
    material: ARROW
    lore:
      - "&7Return to recipe editor"
    amount: 1
    damage: 0
    custom-model-data: 0
    unbreakable: true
    enchants:
      DURABILITY: 1
    flags:
      ALL: true
    sound:
      enabled: true
      name: "UI_BUTTON_CLICK"
      volume: 0.5
      pitch: 0.8

  # Clear all button
  clear_all:
    slot: 48
    name: "&c&lClear All Materials"
    material: TNT
    lore:
      - "&7Remove all material requirements"
      - "&7"
      - "&c&lWARNING: Cannot be undone!"
    amount: 1
    damage: 0
    custom-model-data: 0
    unbreakable: true
    enchants:
      DURABILITY: 1
    flags:
      ALL: true
    sound:
      enabled: true
      name: "ENTITY_GENERIC_EXPLODE"
      volume: 0.3
      pitch: 1.2
