cropstorage_version: 1

# Worlds that will not be affected by CropStorage feature
blacklist_world:
  - defaultworld
  - exampleworld

settings:
  enabled: true
  default_max_storage: 5000
  #How to resolve max storage between database/commands and permissions.
  # PERMISSION: Always use permission-based value.
  # DATABASE: Always use database value (set by commands or external systems).
  # MAX: Use the higher value between permission and database.
  # MIN: Use the lower value between permission and database.
  # Default: PERMISSION
  max_storage_mode: PERMISSION
  default_auto_pickup: false

  # Silk Touch behavior for CropStorage harvesting.
  # When enabled, breaking certain crops with Silk Touch will store the "block form" if supported.
  # Current use-case: Melon
  # - Without Silk Touch: stores MELON_SLICE (vanilla behavior).
  # - With Silk Touch: stores MELON (1.13+) or MELON_BLOCK (1.8 - 1.12) if configured in items_drop.
  # Set to false to always use the normal mapping (e.g. always MELON_SLICE).
  silk_touch:
    enabled: true

# Controls how autopickup handles tall column crops
# base_only: only scan/store the whole column when breaking the base block.
# any_segment: breaking any block in the column will scan/store the whole column.
# above_only: breaking any block will scan/store that block + blocks above it (keeps the lower blocks so it can regrow).
tall_crops:
  scan_mode: above_only

# Sell commands executed when paying via `commands` method or when fallback happens.
# Placeholders:
# - #player# : player name
# - #money#  : formatted amount (see number_format)
sell:
  - "eco give #player# #money#"

# Sell payout method (global default)
# - commands: Execute configured sell commands (default)
# - vault: Deposit money via Vault economy; fallback to commands if Vault is unavailable or fails
# - playerpoints: Give points via PlayerPoints; fallback to commands if PlayerPoints is unavailable or fails
#
# Note: You can override the payout method per crop in `worth:` using "<price>;<method>".
sell_method: commands

auto_sell:
  enabled: true
  # Default delay in seconds between auto-sell checks per crop.
  # You can override per-player with permissions:
  # - storage.cropstorage.autosell.delay.<seconds>
  default_delay: 5.0
  # Trigger mode:
  # - BOTH: autosell triggers on deposit AND when enabling autosell for an existing crop.
  # - DEPOSIT_ONLY: autosell triggers only when crops are added into CropStorage.
  # - TOGGLE_ONLY: autosell triggers only when enabling autosell for a crop that already exists in CropStorage.
  # - DISABLED: autosell never triggers automatically.
  trigger: BOTH

# Number format used for money when selling crops
number_format: "#.##"

# Worth per crop item. Key supports both MATERIAL and MATERIAL;0.
# Format:
# - Default: <price>
# - With per-item payout override: "<price>;<method>" where method is one of: commands | vault | playerpoints
#   (This overrides sell_method ONLY for that crop)
worth:
  WHEAT: 1.4
  CARROT: 1.2
  POTATO: 1.2
  BEETROOT: 2.1
  NETHER_WART: 3
  SUGAR_CANE: 1.2
  COCOA_BEANS: 3.4
  MELON_SLICE: 2.43
  PUMPKIN: 2.45
  SWEET_BERRIES: 3
  KELP: 2.4
  BAMBOO: 2
  CACTUS: 2.5

ground_store:
  # Enable/disable ground-store system for CropStorage.
  enabled: true

  # Default toggle state for new players.
  default_enabled: false

  # Crop items that will be stored when picked up from the ground.
  # IMPORTANT:
  # - This list depends on items_drop.
  # - If an item is not present in items_drop, it will NOT be stored.
  # These must match the Material names used in items_drop.
  # Examples:
  # - WHEAT
  # - CARROT
  allowed_items:
    - WHEAT
    - CARROT

  # Notification settings for ground-store.
  notification:
    actionbar:
      enable: true
    title:
      enable: true

  sound:
    enabled: true
    name: ENTITY_ITEM_PICKUP
    volume: 0.7
    pitch: 1.0

# CropStorage limit based on permissions
# Players with permission storage.cropstorage.storage.<tier_name> will receive the configured max_storage
# Priority system: higher number = higher priority (overrides lower priority)
# If the player has multiple CropStorage limit permissions, the highest priority will be used
# If no CropStorage limit permission is found, settings.default_max_storage will be used
crop_storage_permissions:
  vip:
    max_storage: 200
    priority: 1
  premium:
    max_storage: 500
    priority: 2
  ultimate:
    max_storage: 1000
    priority: 3
  # You can add more permissions here.
  # abc:
  #  max_storage: 5000
  #  priority: 4

storage_full_notification:
  enabled: true
  cooldown_seconds: 10

notification:
  title:
    enable: false
    item_added:
      title: "&a+ #amount# #item#"
      subtitle: "&a#storage#&7/&a#max#"
    storage_full:
      title: "&cStorage Full!"
      subtitle: "&7(&c#storage#&7/&c#max#&7)"
  actionbar:
    enable: true
    # Placeholders: #item#, #amount#, #storage#, #max#
    item_added: "&a+ #amount# #item# &7| &a#storage#&7/&a#max#"
    storage_full: "&cStorage Full! &7(&c#storage#&7/&c#max#&7)"

# Vanilla Minecraft crop items that can be stored
# Use the Material name (e.g., WHEAT, CARROT, POTATO)
# The display name in GUI will be auto-generated from the Material name
# You can also configure custom display names below
items_drop:
  - WHEAT
  - CARROT
  - POTATO
  - BEETROOT
  - NETHER_WART
  - SUGAR_CANE
  - COCOA_BEANS
  - MELON_SLICE
  - MELON
  - PUMPKIN
  - SWEET_BERRIES
  - KELP
  - BAMBOO
  - CACTUS
  - TORCHFLOWER
  - PITCHER_PLANT
  - CHORUS_FRUIT

# Custom display names for crop items (optional)
# If not set, the Material name will be used with proper formatting
# Format: MATERIAL_NAME: "Display Name"
crop_display_names:
  WHEAT: "&eWheat"
  CARROT: "&6Carrot"
  POTATO: "&ePotato"
  BEETROOT: "&cBeetroot"
  NETHER_WART: "&4Nether Wart"
  SUGAR_CANE: "&aSugar Cane"
  COCOA_BEANS: "&6Cocoa Beans"
  MELON_SLICE: "&aMelon Slice"
  MELON: "&aMelon"
  PUMPKIN: "&6Pumpkin"
  SWEET_BERRIES: "&cSweet Berries"
  KELP: "&2Kelp"
  BAMBOO: "&aBamboo"
  CACTUS: "&2Cactus"
  TORCHFLOWER: "&#FFB645Torchflower"
  PITCHER_PLANT: "&#5F00FCPitcher Plant"
  CHORUS_FRUIT: "&#5745FFChorus Fruit"

# Block-to-Drop mapping for crop harvesting
# Maps the block type to the item that should be added to storage
# Format: BLOCK_MATERIAL: DROP_MATERIAL
# This is used by the CropBreak listener to determine what to store
crop_block_mapping:
  WHEAT: WHEAT
  CARROTS: CARROT
  POTATOES: POTATO
  BEETROOTS: BEETROOT
  NETHER_WART: NETHER_WART
  SUGAR_CANE: SUGAR_CANE
  COCOA: COCOA_BEANS
  MELON: MELON_SLICE
  PUMPKIN: PUMPKIN
  SWEET_BERRY_BUSH: SWEET_BERRIES
  KELP: KELP
  KELP_PLANT: KELP
  BAMBOO: BAMBOO
  CACTUS: CACTUS
  TORCHFLOWER: TORCHFLOWER
  PITCHER_PLANT: PITCHER_PLANT
  CHORUS_PLANT: CHORUS_FRUIT
  CHORUS_FLOWER: CHORUS_FRUIT
