# MobStorage Configuration

mobstorage_version: 2

blacklist_world:
  - defaultworld
  - exampleworld

settings:
  enabled: true
  default_max_storage: 5000
  # PERMISSION: use permission-based value.
  # DATABASE: use database value from commands/external systems.
  # MAX: use the higher value between permission and database.
  # MIN: use the lower value between permission and database.
  max_storage_mode: PERMISSION
  default_auto_pickup: false
  allow_custom_item_meta: false
  ignore_mythic_items: true

sell_method: commands
number_format: "#.##"
sell:
  - "eco give #player# #money#"

auto_sell:
  enabled: true
  trigger: BOTH
  default_delay: 5

enabled_groups:
  passive: true
  neutral: true
  hostile: true
  boss: false
  utility: false

mob_groups:
  passive:
    - COW
    - MUSHROOM_COW
    - CHICKEN
    - PIG
    - SHEEP
    - RABBIT
    - HORSE
    - DONKEY
    - MULE
    - LLAMA
    - TURTLE
    - COD
    - SALMON
    - PUFFERFISH
    - TROPICAL_FISH
  neutral:
    - ENDERMAN
    - SPIDER
    - CAVE_SPIDER
    - WOLF
    - BEE
    - ZOMBIFIED_PIGLIN
    - PIG_ZOMBIE
    - PIGLIN
    - POLAR_BEAR
    - DOLPHIN
  hostile:
    - ZOMBIE
    - SKELETON
    - CREEPER
    - BLAZE
    - DROWNED
    - HUSK
    - STRAY
    - WITCH
    - SLIME
    - MAGMA_CUBE
    - GHAST
    - PHANTOM
    - WITHER_SKELETON
    - ZOMBIE_VILLAGER
    - SILVERFISH
    - ENDERMITE
  boss:
    - ENDER_DRAGON
    - WITHER
  utility:
    - IRON_GOLEM
    - SNOWMAN
    - VILLAGER
    - WANDERING_TRADER

ground_store:
  enabled: true
  default_enabled: false
  allowed_items:
    - ROTTEN_FLESH
    - BONE
    - STRING
  notification:
    actionbar:
      enable: true
    title:
      enable: true
  sound:
    enabled: true
    name: ENTITY_ITEM_PICKUP
    volume: 0.7
    pitch: 1.0

mob_storage_permissions:
  vip:
    max_storage: 200
    priority: 1
  premium:
    max_storage: 500
    priority: 2
  ultimate:
    max_storage: 1000
    priority: 3

storage_full_notification:
  enabled: true
  cooldown_seconds: 10

notification:
  title:
    enable: false
    item_added:
      title: "&a+ #amount# #item#"
      subtitle: "&a#storage#&7/&a#max#"
    storage_full:
      title: "&cMobStorage Full!"
      subtitle: "&7(&c#storage#&7/&c#max#&7)"
  actionbar:
    enable: true
    item_added: "&a+ #amount# #item# &7| &a#storage#&7/&a#max#"
    storage_full: "&cMobStorage Full! &7(&c#storage#&7/&c#max#&7)"

