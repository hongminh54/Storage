  - SNOW_GOLEM;SNOWBALL

ground_store:
  # Enable/disable ground-store system for MobStorage.
  enabled: true

  # Default toggle state for new players.
  default_enabled: false

  # Items that will be stored when picked up from the ground.
  # IMPORTANT:
  # - This list depends on mob_drops.
  # - If an item is not present in mob_drops, it will NOT be stored.
  # These must match the Material names used in mob_drops.
  # Examples:
  # - ROTTEN_FLESH
  # - BONE
  allowed_items:
    - ROTTEN_FLESH
    - BONE
    - STRING

  # Notification settings for ground-store.
  # These notifications reuse the existing MobStorage notification formats.
  notification:
    actionbar:
      enable: true
    title:
      enable: true

  sound:
    enabled: true
    name: ENTITY_ITEM_PICKUP
    volume: 0.7
    pitch: 1.0

# MobStorage limit based on permissions
# Players with permission storage.mobstorage.storage.<tier_name> will receive the configured max_storage
# Priority system: higher number = higher priority (overrides lower priority)
# If the player has multiple MobStorage limit permissions, the highest priority will be used
# If no MobStorage limit permission is found, settings.default_max_storage will be used
mob_storage_permissions:
  vip:
    max_storage: 200
    priority: 1
  premium:
    max_storage: 500
    priority: 2
  ultimate:
    max_storage: 1000
    priority: 3
  # You can add more permissions here.
  # abc:
  #  max_storage: 5000
  #  priority: 4

storage_full_notification:
  enabled: true
  cooldown_seconds: 10

notification:
  title:
    enable: false
    item_added:
      title: "&a+ #amount# #item#"
      subtitle: "&a#storage#&7/&a#max#"
    storage_full:
      title: "&cMobStorage Full!"
      subtitle: "&7(&c#storage#&7/&c#max#&7)"
  actionbar:
    enable: true
    # Placeholders: #item#, #amount#, #storage#, #max#
    item_added: "&a+ #amount# #item# &7| &a#storage#&7/&a#max#"
    storage_full: "&cMobStorage Full! &7(&c#storage#&7/&c#max#&7)"
  # Combine multiple picked-up items into one notification within a short window
  combine:
    enable: true
    # Max items displayed in a single notification
    max_items: 3
    # Max wait (in seconds) from the first picked-up item before sending.
    # Items merge while pickups keep coming and are sent ~0.1s after the last pickup,
    # so 0 = no visible delay while still combining bursts (vein-mine/TNT, ground-store).
    duration_seconds: 0
    # Separator between entries (use "\n" for multiline subtitle on 1.20.3+)
    separator: " "

# Worth per mob drop item. Key supports both MATERIAL and MATERIAL;0.
# Format:
# - Default: <price>
# - With per-item payout override: "<price>;<method>" where method is one of: commands | vault | playerpoints
