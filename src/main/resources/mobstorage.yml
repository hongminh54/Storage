#MobStorage Configuration

mobstorage_version: 2

# Worlds that will not be affected by MobStorage feature
blacklist_world:
  - defaultworld
  - exampleworld

settings:
  enabled: true
  default_max_storage: 5000
  #How to resolve max storage between database/commands and permissions.
  # PERMISSION: Always use permission-based value.
  # DATABASE: Always use database value (set by commands or external systems).
  # MAX: Use the higher value between permission and database.
  # MIN: Use the lower value between permission and database.
  # Default: PERMISSION
  max_storage_mode: PERMISSION
  default_auto_pickup: false
  # When true, store as much of a drop as fits when storage is nearly full
  # and leave the remainder to drop on the ground.
  partial_store_when_full: false
  # When false, only plain vanilla drops are stored.
  # Items with a custom display name, lore, enchantments, item flags or
  # custom model data are skipped.
  allow_custom_item_meta: false
  # When true, drops coming from MythicMobs are never stored in MobStorage.
  ignore_mythic_items: true

# Sell payout method (global default)
# - commands: Execute configured sell commands (default)
# - vault: Deposit money via Vault economy; fallback to commands if Vault is unavailable or fails
# - playerpoints: Give points via PlayerPoints; fallback to commands if PlayerPoints is unavailable or fails
#
# Note: You can override the payout method per item in `worth:` using "<price>;<method>".
sell_method: commands

# Number format used for money when selling mob drops
number_format: "#.##"

# Sell commands executed when paying via `commands` method or when fallback happens.
# Placeholders:
# - #player# : player name
# - #money#  : formatted amount (see number_format)
sell:
  - "eco give #player# #money#"

auto_sell:
  enabled: true
  # Trigger mode:
  # - BOTH: autosell triggers on deposit AND when enabling autosell for an existing item.
  # - DEPOSIT_ONLY: autosell triggers only when mob drops are added into MobStorage.
  # - TOGGLE_ONLY: autosell triggers only when enabling autosell for an item that already exists in MobStorage.
  # - DISABLED: autosell never triggers automatically.
  trigger: BOTH
  # Default delay in seconds between auto-sell checks per item.
  # You can override per-player with permissions:
  # - storage.mobstorage.autosell.delay.<seconds>
  default_delay: 5

# MobStorage transfer settings
# Controls the /mobstorage transfer feature (single + multi) and history display.
transfer:
  enabled: true
  # Delay in seconds before completing a transfer.
  delay: 3
  # Max number of history entries to show per page in /mobstorage transfer log
  max_history_display: 10

  particles:
    enabled: true
    processing:
      animation: "circle"
      type: "ENCHANTMENT_TABLE"
      count: 8
      speed: 0.1
      radius: 1.5
      duration: 3
    beam:
      animation: "line"
      type: "FIREWORKS_SPARK"
      count: 3
      speed: 0.2
      duration: 3
    success:
      animation: "burst"
      type: "VILLAGER_HAPPY"
      count: 15
      speed: 0.1
      radius: 2.0
    receive:
      animation: "circle"
      type: "HEART"
      count: 8
      speed: 0.1
      radius: 1.2
    failed:
      animation: "burst"
      type: "SMOKE_NORMAL"
      count: 12
      speed: 0.15
      radius: 1.8

  sounds:
    enabled: true
    success:
      name: ENTITY_EXPERIENCE_ORB_PICKUP
      volume: 1.0
      pitch: 1.2
    receive:
      name: ENTITY_ITEM_PICKUP
      volume: 0.8
      pitch: 1.0

# Mob drops that can be stored and their drop items.
# Format: MOB_NAME;DROP;DROP;...
# The mob name must match the vanilla EntityType name (e.g. ZOMBIE, SKELETON).
# Each listed drop is stored separately when the mob dies.
mob_drops:
  - ZOMBIE;ROTTEN_FLESH
  - HUSK;ROTTEN_FLESH
  - DROWNED;ROTTEN_FLESH
  - ZOMBIE_VILLAGER;ROTTEN_FLESH
  - SKELETON;BONE;ARROW
  - STRAY;BONE;ARROW
  - WITHER_SKELETON;BONE;COAL
  - CREEPER;GUNPOWDER
  - SPIDER;STRING;SPIDER_EYE
  - CAVE_SPIDER;STRING;SPIDER_EYE
  - ENDERMAN;ENDER_PEARL
  - WITCH;GLOWSTONE_DUST;REDSTONE;GUNPOWDER;SPIDER_EYE;GLASS_BOTTLE;STICK;SUGAR
  - SLIME;SLIME_BALL
  - MAGMA_CUBE;MAGMA_CREAM
  - BLAZE;BLAZE_ROD
  - GHAST;GHAST_TEAR;GUNPOWDER
  - PHANTOM;PHANTOM_MEMBRANE
  - BREEZE;BREEZE_ROD
  - SILVERFISH;STONE
  - ENDERMITE;ENDER_PEARL
  - COW;LEATHER;BEEF;COOKED_BEEF
  - MUSHROOM_COW;LEATHER;BEEF;COOKED_BEEF
  - PIG;PORKCHOP;COOKED_PORKCHOP
  - SHEEP;WOOL;WHITE_WOOL;MUTTON;COOKED_MUTTON
  - CHICKEN;FEATHER;CHICKEN;COOKED_CHICKEN;EGG
  - RABBIT;RABBIT;COOKED_RABBIT;RABBIT_HIDE;RABBIT_FOOT
  - HORSE;LEATHER
