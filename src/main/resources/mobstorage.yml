  - IRON_GOLEM;IRON_INGOT;POPPY
  - SNOWMAN;SNOWBALL
  - SNOW_GOLEM;SNOWBALL

ground_store:
  enabled: true
  default_enabled: false
  allowed_items:
    - ROTTEN_FLESH
    - BONE
    - STRING
  notification:
    actionbar:
      enable: true
    title:
      enable: true
  sound:
    enabled: true
    name: ENTITY_ITEM_PICKUP
    volume: 0.7
    pitch: 1.0

mob_storage_permissions:
  vip:
    max_storage: 200
    priority: 1
  premium:
    max_storage: 500
    priority: 2
  ultimate:
    max_storage: 1000
    priority: 3

storage_full_notification:
  enabled: true
  cooldown_seconds: 10

notification:
  title:
    enable: false
    item_added:
      title: "&a+ #amount# #item#"
      subtitle: "&a#storage#&7/&a#max#"
    storage_full:
      title: "&cMobStorage Full!"
      subtitle: "&7(&c#storage#&7/&c#max#&7)"
  actionbar:
    enable: true
    item_added: "&a+ #amount# #item# &7| &a#storage#&7/&a#max#"
    storage_full: "&cMobStorage Full! &7(&c#storage#&7/&c#max#&7)"

