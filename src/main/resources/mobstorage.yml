# MobStorage Configuration

mobstorage_version: 5

blacklist_world:
  - defaultworld
  - exampleworld

settings:
  enabled: true
  default_max_storage: 5000
  # PERMISSION: use permission-based value.
  # DATABASE: use database value from commands/external systems.
  # MAX: use the higher value between permission and database.
  # MIN: use the lower value between permission and database.
  max_storage_mode: PERMISSION
  default_auto_pickup: false
  allow_custom_item_meta: false
  ignore_mythic_items: true

sell_method: commands
number_format: "#.##"
sell:
  - "eco give #player# #money#"

auto_sell:
  enabled: true
  trigger: BOTH
  default_delay: 5

mob_drops:
  - ZOMBIE;ROTTEN_FLESH
  - HUSK;ROTTEN_FLESH
