  - GLOW_SQUID;GLOW_INK_SAC
  - GUARDIAN;PRISMARINE_SHARD;PRISMARINE_CRYSTALS;COD
  - ELDER_GUARDIAN;PRISMARINE_SHARD;PRISMARINE_CRYSTALS;COD
  - BEE;HONEYCOMB
  - WOLF;BONE
  - POLAR_BEAR;COD;SALMON
